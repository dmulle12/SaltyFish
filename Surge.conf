[General]
# ========== GLOBAL SETTINGS ==========

# DNS Configuration - Overseas optimization
dns-server = 8.8.8.8, 1.1.1.1, 8.8.4.4
encrypted-dns-server = tls://8.8.8.8, tls://1.1.1.1, https://dns.google/dns-query

# Hijack hardcoded DNS queries to prevent bypass
hijack-dns = 119.29.29.29:53, 182.254.116.116:53

# Preserve real IP for STUN/NAT type detection (gaming, video calls)
always-real-ip = *.srv.nintendo.net, *.stun.playstation.net, *.stun.l.google.com, *.stun*.stunprotocol.org

# IPv6 support (disable if your ISP has issues)
ipv6 = true

# TCP Fast Open for lower latency
tfo = true

# UDP relay support
udp-policy-not-supported-behaviour = REJECT

# Show traffic statistics
show-traffic-statistics = true

# Logging level: info, warning, error
loglevel = warning

# Exclude system apps from Surge (optional)
# exclude-simple-hostnames = true

# ========== PROXY SERVER DEFINITIONS ==========

[Proxy]
# ============================================
# IMPORTANT: Replace these with your actual proxy servers
# Remove or comment out examples you don't use
# ============================================

# Snell v4 Proxy - Recommended for speed & latency
# Example: Snell-US = snell, server.example.com, 8443, psk=your-psk-key, version=4, reuse=true, tfo=true
# Example: Snell-SG = snell, sg.example.com, 8443, psk=your-psk-key, version=4, reuse=true, tfo=true

# Trojan Proxy - Good for HTTPS obfuscation
# Example: Trojan-US = trojan, us.example.com, 443, password=your-password, sni=www.example.com, skip-cert-verify=false

# SOCKS5 Proxy
# Example: SOCKS5-JP = socks5, jp.example.com, 1080, username=user, password=pass

# Shadowsocks
# Example: SS-HK = ss, hk.example.com, 443, encrypt-method=aes-256-gcm, password=your-password

# Direct connection (no proxy)
DIRECT = direct

[Proxy Group]
# ========== POLICY GROUPS ==========

# Smart Group - AUTO selects best proxy based on real-time latency
Proxy = smart, DIRECT, timeout=5, interval=600, evaluate-before-use=false
# Add your proxies: Proxy = smart, Snell-US, Snell-SG, Trojan-US, DIRECT, timeout=5, interval=600

# URL Test Group - Tests connectivity and auto-switches
AutoSwitch = url-test, DIRECT, timeout=5, interval=600, tolerance=100
# Add your proxies: AutoSwitch = url-test, Snell-US, Snell-SG, DIRECT, timeout=5, interval=600

# Fallback Group - Uses first available proxy
Fallback = fallback, DIRECT, timeout=5, interval=600
# Add your proxies: Fallback = fallback, Snell-US, Snell-SG, DIRECT, timeout=5, interval=600

# Manual Selection - Manually choose proxy in app
Manual = select, DIRECT
# Add your proxies: Manual = select, Snell-US, Snell-SG, Trojan-US, DIRECT

# Streaming Services Group
Streaming = select, Proxy, DIRECT

# Social Media Group
SocialMedia = select, Proxy, DIRECT

# Gaming Group (low latency priority)
Gaming = smart, DIRECT, timeout=5, interval=600

[Rule]
