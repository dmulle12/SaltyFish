# ===== IP RULES (Triggers DNS resolution) =====

# Private/Local IP addresses - Always direct
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,240.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve

# IPv6 private ranges
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve

# China IP addresses - Direct (for mainland China services)
GEOIP,CN,DIRECT

# ===== FINAL CATCH-ALL RULE =====
# Default to proxy; if DNS fails, still route through proxy
FINAL,Proxy,dns-failed

[Host]
# ========== LOCAL DNS OVERRIDES ==========
# Map domains to specific IPs locally (no DNS lookup needed)

# Example:
# example.local = 192.168.1.100
# myapp.test = 127.0.0.1

[URL Rewrite]
# ========== URL REWRITE RULES ==========
# Redirect URLs before they're processed

# Example - Force HTTPS:
# ^http://example\.com/ https://example.com/ 302

# Example - Remove tracking parameters:
# ^https://example\.com/search\?(.*)utm_source=.* https://example.com/search?$1  302

# Block ads by redirecting to nothing:
# ^https://ads\.example\.com/ - reject

[Header Rewrite]
# ========== HTTP HEADER MODIFICATION ==========
# Modify headers sent to servers

# Example - Spoof User-Agent:
# example.com header-replace User-Agent "Mozilla/5.0"

# Example - Add custom header:
# example.com header-add X-Custom-Header "Value"

# Example - Remove header:
# example.com header-remove X-Tracking-ID

[MITM]
# ========== HTTPS DECRYPTION (OPTIONAL - USE CAUTIOUSLY) ==========
# Enable only if you need to inspect HTTPS traffic
# WARNING: Reduces security, use only for trusted networks

# skip-server-cert-verify = false
# tcp-connection = false
# h2 = false

# Domains to decrypt (only if enabled above):
# hostname = example.com, *.example.com, api.example.org

# Temporarily disable MITM for specific domains:
# hostname-disabled = sensitive.com, bank.com
