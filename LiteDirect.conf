[SSID Setting]
TYPE:WIFI tfo-behaviour=force-enabled, cellular-fallback=wifi-assist, encrypted-dns-server="off"
TYPE:CELLULAR tfo-behaviour=force-disabled, dns-server="system", encrypted-dns-server="off"
"Apple Store" suspend=true

[MITM]
tcp-connection = true
h2 = true
hostname = 78ox6.com, truecaller.com, interface.music.163.com, *.google.cn, *.google.com
hostname-disabled = *.google.cn, *.google.com, truecaller.com, 78ox6.com
