#!name=Surge 5 iOS Return-to-China
#!desc=Return-to-China profile using blackmatrix7 remote rules
#!version=5.21.1

[General]
loglevel = notify
show-error-page-for-reject = true
ipv6 = true
test-timeout = 5
internet-test-url = http://www.apple.com/library/test/success.html
proxy-test-url = http://cp.cloudflare.com/generate_204

dns-server = system, 223.5.5.5, 119.29.29.29, 114.114.114.114, 1.1.1.1, 8.8.8.8
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
skip-proxy = 127.0.0.1, localhost, *.local, captive.apple.com
exclude-simple-hostnames = true
allow-wifi-access = false
http-api = 127.0.0.1:6171
http-api-tls = false

[Proxy]
DIRECT = direct
REJECT = reject

# Replace the following sample nodes with your own return-to-China nodes.
CN-Shanghai = trojan, cn-shanghai.example.com, 443, ****** sni=cn-shanghai.example.com, skip-cert-verify=true, udp-relay=true, tfo=true
CN-Guangzhou = ss, cn-guangzhou.example.com, 8388, encrypt-method=aes-128-gcm, ****** udp-relay=true, tfo=true
CN-Beijing = vmess, cn-beijing.example.com, 443, username=00000000-0000-0000-0000-000000000000, ws=true, ws-path=/path, tls=true, sni=cn-beijing.example.com, skip-cert-verify=true, udp-relay=true

[Proxy Group]
Return-to-China = select, Auto-Return, CN-Shanghai, CN-Guangzhou, CN-Beijing, DIRECT
Auto-Return = url-test, CN-Shanghai, CN-Guangzhou, CN-Beijing, url=http://www.baidu.com/generate_204, interval=300, tolerance=80, timeout=5
China-Media = select, Return-to-China, Auto-Return, DIRECT
China-Apps = select, Return-to-China, Auto-Return, DIRECT
China-Games = select, Return-to-China, Auto-Return, DIRECT
China-Finance = select, Return-to-China, Auto-Return, DIRECT
Apple = select, DIRECT, Return-to-China
AdBlock = select, REJECT, DIRECT

[Rule]
# Ads / privacy
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,AdBlock
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Privacy/Privacy.list,AdBlock
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Hijacking/Hijacking.list,AdBlock

# Local network
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list,DIRECT

# Apple
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list,Apple

# China media
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Bilibili/Bilibili.list,China-Media
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/CCTV/CCTV.list,China-Media
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/NetEaseMusic/NetEaseMusic.list,China-Media

# China apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list,China-Apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list,China-Apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba.list,China-Apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent.list,China-Apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Baidu/Baidu.list,China-Apps
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ByteDance/ByteDance.list,China-Apps

# China games / finance
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Game/Game.list,China-Games
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AliPay/AliPay.list,China-Finance
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/UnionPay/UnionPay.list,China-Finance

# China domain / ip
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list,Return-to-China
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax.list,Return-to-China
GEOIP,CN,Return-to-China

# Default: overseas traffic direct
FINAL,DIRECT,dns-failed

[Host]
localhost = 127.0.0.1

[URL Rewrite]

[MITM]
enable = false
