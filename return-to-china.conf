RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China.list,回国模式
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax.list,回国模式
GEOIP,CN,回国模式

# 兜底：海外网站默认直连
FINAL,DIRECT,dns-failed


[Host]
localhost = 127.0.0.1


[URL Rewrite]
# 可按需添加去广告、重定向规则，不建议默认开启过多规则，避免影响国内 App 登录和支付。


[MITM]
# 不建议普通用户开启 MITM，容易影响银行、支付、政务、视频 App。
# 如果你需要重写或脚本功能，再手动配置证书。
enable = false


使用说明：

1. 把上面内容保存为 .conf 文件，例如：
Surge5-Return-to-China.conf

2. 打开 Surge 5 iOS：
配置 -> 从文件导入

3. 修改 [Proxy] 区域：
把“回国节点-上海 / 广州 / 北京”替换成你自己的中国大陆或中国优化线路节点。

4. 如果你的机场提供 Surge 订阅：
可以直接把节点粘贴到 [Proxy] 区域；
或者使用外部订阅策略组，但手动配置更稳定。

5. 推荐策略：
回国模式：选择“自动回国”
中国媒体：选择“回国模式”
中国应用：选择“回国模式”
中国金融：选择“回国模式”
苹果服务：建议 DIRECT
全球直连：建议 DIRECT

6. 如果某些海外网站也被回国代理了：
把该网站单独加到规则顶部，例如：

DOMAIN-SUFFIX,google.com,DIRECT
DOMAIN-SUFFIX,youtube.com,DIRECT
DOMAIN-SUFFIX,facebook.com,DIRECT
DOMAIN-SUFFIX,instagram.com,DIRECT
DOMAIN-SUFFIX,x.com,DIRECT

7. 如果某个中国 App 仍提示地区限制：
把该 App 的域名加到 [Rule] 顶部并指定“回国模式”，例如：

DOMAIN-SUFFIX,example.cn,回国模式
DOMAIN-KEYWORD,example,回国模式

8. 如果银行、支付宝、微信支付异常：
优先尝试：
中国金融 -> DIRECT
或
中国金融 -> 回国模式

不同银行风控不同，部分银行可能更信任海外本地 IP，部分银行更信任中国 IP。

