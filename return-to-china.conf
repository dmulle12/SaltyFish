# The following is a set of "Return Configuration File" template suitable for Surge 5 iOS overseas users.

# Purpose: When accessing mainland China App, video, music, online banking, government affairs, games and other services overseas, it automatically goes to the "return to China node"; when accessing overseas websites, it is directly connected by default; mainland China websites, apps and streaming media give priority to returning to China as agents; advertising and privacy tracking are the basic blocking.


[General]
loglevel = notify
ipv6 = true
show-error-page-for-reject = true
test-timeout = 5
internet-test-url = http://www.apple.com/library/test/success.html
proxy-test-url = http://www.gstatic.com/generate_204
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb

dns-server = system, 223.5.5.5, 119.29.29.29, 114.114.114.114, 1.1.1.1, 8.8.8.8
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

skip-proxy = 127.0.0.1, localhost, *.local, captive.apple.com
exclude-simple-hostnames = true

allow-wifi-access = false
http-api = 127.0.0.1:6171
http-api-tls = false

udp-policy-not-supported-behaviour = REJECT


[Proxy]
# 示例 1：Trojan 回国节点
# 请替换 server、password、sni 等信息
回国节点-上海 = trojan, cn-shanghai.example.com, 443, password=你的密码, sni=cn-shanghai.example.com, skip-cert-verify=true, udp-relay=true, tfo=true

# 示例 2：Shadowsocks 回国节点
# 如不用可删除
回国节点-广州 = ss, cn-guangzhou.example.com, 8388, encrypt-method=aes-128-gcm, password=你的密码, udp-relay=true, tfo=true

# 示例 3：VMess 回国节点
# 如不用可删除
回国节点-北京 = vmess, cn-beijing.example.com, 443, username=你的UUID, ws=true, ws-path=/path, tls=true, sni=cn-beijing.example.com, skip-cert-verify=true, udp-relay=true


[Proxy Group]
回国模式 = select, 自动回国, 回国节点-上海, 回国节点-广州, 回国节点-北京, DIRECT

自动回国 = url-test, 回国节点-上海, 回国节点-广州, 回国节点-北京, url=http://www.baidu.com, interval=300, tolerance=80, timeout=5

中国媒体 = select, 回国模式, 自动回国, DIRECT

中国应用 = select, 回国模式, 自动回国, DIRECT

中国游戏 = select, 回国模式, 自动回国, DIRECT

中国金融 = select, 回国模式, 自动回国, DIRECT

苹果服务 = select, DIRECT, 回国模式

全球直连 = select, DIRECT, 回国模式

广告拦截 = select, REJECT, DIRECT


[Rule]
# 广告与隐私追踪
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Advertising/Advertising.list,广告拦截
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Privacy/Privacy.list,广告拦截
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Hijacking/Hijacking.list,广告拦截

# 局域网直连
