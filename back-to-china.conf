[Host]
# Host mappings for China services (optional)
# example.cn = 1.2.3.4
# *.internal.cn = 192.168.1.100

[URL Rewrite]
# URL Rewrite for China services (optional)
# ^http://example\.cn http://www.example.cn 302
# ^https://m\.taobao\.com https://h5.m.taobao.com 302

[Header Rewrite]
# Header modification for China services (optional)
# ^https://example\.cn header-add X-Custom-Header value
# ^https://api\.bilibili\.com header-del User-Agent

[MITM]
# MITM settings for China services
enable = true
skip-server-cert-verify = false
ca-passphrase = surge
ca-p12 = 
hostname = *.bilibili.com, *.youku.com, *.iqiyi.com, *.qq.com, *.weixin.qq.com, *.taobao.com, *.jd.com, *.weibo.com, *.zhihu.com, *.douban.com, *.music.163.com, *.kugou.com

[Script]
# Script for China services (optional)
# http-request ^https?://example\.cn script-path = https://example.com/script.js
# http-response ^https?://api\.bilibili\.com script-path = https://example.com/bilibili.js
# cron "0 8 * * *" script-path = https://example.com/cron.js

[Filter]
# Content filtering (optional)
# DOMAIN,ads.example.cn,reject
# DOMAIN-SUFFIX,adserver.cn,reject
# IP-CIDR,1.2.3.0/24,reject

[Policy]
# Policy groups for China services (optional)
# china-streaming = select, CN-Shanghai, CN-Beijing, CN-Guangzhou
# china-gaming = select, CN-Shanghai, CN-Guangzhou
# china-music = select, CN-Shanghai, CN-Beijing

